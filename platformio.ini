[platformio]
default_envs = uno_pololu_maze

; The competition program (src/pololu_maze_firmware.cpp), built on Pololu's
; ZumoShield MazeSolver example. Upload with
; scripts\run-competition-firmware.ps1 -Port COM4
[env:uno_pololu_maze]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  pololu/ZumoShield@^2.1.0
build_flags =
  -std=gnu++11
  -DPOLOLU_MAZE_FIRMWARE
